<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octo Magic — Jouer</title>
<script>
  // No playing logged out: to the site's login, back here after (same check as site.session()).
  try {
    if (!JSON.parse(localStorage.getItem("octo.session") || "null")?.refresh) throw 0;
  } catch {
    location.replace("/account?then=/game");
  }
</script>
<link rel="alternate" hreflang="fr" href="https://octo-magic.notdotio.com/game">
<link rel="alternate" hreflang="en" href="https://octo-magic.notdotio.com/en/game">
<link rel="alternate" hreflang="x-default" href="https://octo-magic.notdotio.com/en/game">
<meta name="theme-color" content="#120d24">
<link rel="icon" href="/assets/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="game">
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img class="pixel" src="/assets/icon.png" alt="">Octo Magic</a>
    <h1>Jouer</h1>
    <nav><a href="#" id="fullscreen">Plein écran</a><a class="hide-sm" href="/account" data-who>Connexion</a><a class="lang" href="/en/game" hreflang="en" lang="en" title="English" data-lang="en">EN</a></nav>
  </div>
</header>
<!-- The game's web export (Godot), same origin: it shares the site's login (site.js). -->
<iframe id="game" src="/godot/index.html" title="Octo Magic" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<script type="module">
  import "/site.js";
  const game = document.getElementById("game");
  game.addEventListener("load", () => game.focus());
  document.getElementById("fullscreen").onclick = (e) => {
    e.preventDefault();
    game.requestFullscreen();
  };
</script>
</body>
</html>
