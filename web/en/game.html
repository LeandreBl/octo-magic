<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octo Magic — Play</title>
<script>
  // No playing logged out: to the site's login, back here after (same check as site.session()).
  try {
    if (!JSON.parse(localStorage.getItem("octo.session") || "null")?.refresh) throw 0;
  } catch {
    location.replace("/en/account?then=/en/game");
  }
</script>
<link rel="alternate" hreflang="fr" href="https://octo-magic.notdotio.com/game">
<link rel="alternate" hreflang="en" href="https://octo-magic.notdotio.com/en/game">
<link rel="alternate" hreflang="x-default" href="https://octo-magic.notdotio.com/en/game">
<meta name="theme-color" content="#120d24">
<link rel="icon" href="/assets/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="game">
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/en/"><img class="pixel" src="/assets/icon.png" alt="">Octo Magic</a>
    <h1>Play</h1>
    <nav><a href="#" id="fullscreen">Fullscreen</a><a class="lang" href="/game" hreflang="fr" lang="fr" title="Français" data-lang="fr">FR</a><a class="acct" href="/en/account" data-who aria-label="Log in"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 18c.6-3.8 3.4-6 7-6s6.4 2.2 7 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Log in</span></a></nav>
  </div>
</header>
<!-- The game's web export (Godot), same origin: it shares the site's login (site.js). -->
<iframe id="game" src="/godot/index.html" title="Octo Magic" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<p class="rotate">Turn your phone sideways to play.</p>
<script type="module">
  import "/site.js";
  const game = document.getElementById("game");
  game.addEventListener("load", () => game.focus());
  document.getElementById("fullscreen").onclick = (e) => {
    e.preventDefault();
    game.requestFullscreen().then(() => screen.orientation?.lock?.("landscape")).catch(() => {});
  };
</script>
</body>
</html>
