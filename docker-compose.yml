name: octo-magic

# Everything online: `cp example.env .env`, fill it, `docker compose up -d --build`.
#
# Base shared by every environment. No port is published here:
# - locally, docker-compose.override.yml (loaded automatically) publishes the
#   game and the API on http://localhost:${PORT:-8080};
# - on the VPS, docker-compose.traefik.yml routes them through Traefik
#   instead, selected with COMPOSE_FILE in .env (see example.env).
# The TURN server uses the host's network in both.

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: octo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see example.env}
      POSTGRES_DB: octo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octo -d octo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Reached only by the server, which checks the login first.
  forge:
    restart: unless-stopped
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # One of the two (see example.env): an API key, else a Claude subscription.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      PIXELLAB_TOKEN: ${PIXELLAB_TOKEN:-}
      FORGE_MODEL: ${FORGE_MODEL:-claude-haiku-5-5}
    volumes:
      # Every combination forged so far: the same words give the same spell.
      - forge_cache:/cache

  # TURN (coturn): relays the coop traffic only between players who cannot
  # reach each other directly (strict NATs); the others play peer to peer.
  # Host network: it hands out UDP ports 49160-49200 (open them, and 3478
  # UDP/TCP, in the firewall). Private ranges are denied as peers so the
  # relay cannot reach into the server's network.
  turn:
    restart: unless-stopped
    image: coturn/coturn:4.7
    network_mode: host
    command: >-
      -n --no-cli --log-file=stdout --listening-port=3478
      --min-port=49160 --max-port=49200 --realm=octo-magic --fingerprint
      --use-auth-secret --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required, see example.env}
      --no-tls --no-dtls --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=::1

  server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required, see example.env}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:?FIREBASE_API_KEY is required, see example.env}
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET}
      FORGE_URL: http://forge:8765
      # Who may forge (see example.env); empty: every logged-in player.
      FORGE_EMAILS: ${FORGE_EMAILS:-}
      # docker/start.sh assembles DATABASE_URL, percent-encoding the password.
      POSTGRES_HOST: postgres
      POSTGRES_USER: octo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: octo
    depends_on:
      postgres:
        condition: service_healthy
      forge:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  forge_cache:
  postgres_data:
